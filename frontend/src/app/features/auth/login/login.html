<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <h1>Connexion</h1>

    @if (errorMessage()) {
      <p class="auth-card__error">{{ errorMessage() }}</p>
    }

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" autocomplete="email" />
    @if (form.controls.email.invalid && form.controls.email.touched) {
      <p class="field-error">Email invalide.</p>
    }

    <label for="password">Mot de passe</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.invalid && form.controls.password.touched) {
      <p class="field-error">Mot de passe requis.</p>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Connexion…' : 'Se connecter' }}
    </button>

    <p class="auth-card__switch">Pas encore de compte ? <a routerLink="/register">S'inscrire</a></p>
  </form>
</div>
